name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - devel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/race-management
          COMMIT_SHA=${GITHUB_SHA}
          BRANCH_NAME=${GITHUB_REF_NAME}
          docker build --build-arg GIT_COMMIT_SHA=$GIT_COMMIT_SHA GIT_BRANCH_NAME=$BRANCH_NAME --target production -t $IMAGE_NAME:$COMMIT_SHA .
          docker tag $IMAGE_NAME:$COMMIT_SHA $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$COMMIT_SHA
          docker push $IMAGE_NAME:latest
